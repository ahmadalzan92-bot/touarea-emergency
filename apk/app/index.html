<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0d6efd">
<title>طوارئ 2026</title>
<style>
  html,body{margin:0;height:100%;background:#0d6efd;color:#fff;font-family:'Segoe UI',Tahoma,Arial,sans-serif}
  body{display:flex;align-items:center;justify-content:center;text-align:center}
  .wrap{padding:24px;max-width:340px}
  .logo{width:120px;height:120px;border-radius:24px;background:#fff;padding:10px;object-fit:contain;box-shadow:0 8px 24px rgba(0,0,0,.25)}
  .spinner{width:34px;height:34px;border:4px solid rgba(255,255,255,.35);border-top-color:#fff;border-radius:50%;margin:22px auto 0;animation:spin 1s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  .msg{margin-top:14px;font-size:1rem;font-weight:700}
  .sub{margin-top:8px;font-size:.85rem;opacity:.92;line-height:1.6}
</style>
</head>
<body>
  <div class="wrap">
    <img class="logo" src="./logo-web.png" alt="طوارئ 2026">
    <div class="spinner"></div>
    <div class="msg">جارٍ فتح النظام وتحميل أحدث نسخة…</div>
    <div class="sub" id="sub">يتم الآن الاتصال بالسحابة لجلب آخر التحديثات.</div>
  </div>
<script>
  (function(){
    var CLOUD = 'https://ahmadalzan92-bot.github.io/touarea-emergency/Test_V22.html';
    var MARK = 'NITRON_MIGRATE:';
    var MAX = 1500000;

    function snapshot(){
      try{
        var o = {}, i;
        for(i = 0; i < localStorage.length; i++){
          var k = localStorage.key(i);
          if(k === '__cloudSyncMeta' || k === 'opendirPasswords') continue;
          o[k] = localStorage.getItem(k);
        }
        return o;
      }catch(e){ return null; }
    }
    function go(){
      try{
        var data = snapshot();
        if(data){
          var text = JSON.stringify(data);
          if(text.length > 2 && text.length < MAX){
            window.name = MARK + text;
          }
        }
      }catch(e){}
      location.replace(CLOUD);
    }
    window.addEventListener('online', function(){
      var s = document.getElementById('sub');
      if(s) s.textContent = 'تم استعادة الاتصال… جارٍ المتابعة.';
    });
    go();
    setTimeout(function(){
      var s = document.getElementById('sub');
      if(s) s.textContent = 'يبدو أن الاتصال بطيء… تأكد من الإنترنت ثم أعد فتح التطبيق.';
    }, 12000);
  })();
</script>
</body>
</html>
